name: Android Release AAB

# Builds the signed, store-bound AAB (preset "Android Release", package com.cloudydaygames.aimfor20)
# on every push to the `release` branch, and on demand. `main` keeps building debug APKs for the
# phone (android.yml); `release` only ever receives merges from `main` (plus hotfixes that are
# merged back). Upload to Play is manual for now: download the AAB artifact from this run.
#
# Secrets:
#   ANDROID_RELEASE_KEYSTORE_B64       base64 of cloudyday_release.keystore   (required)
#   ANDROID_RELEASE_KEYSTORE_PASSWORD  its store/key password                 (required)
#   ANDROID_RELEASE_KEYSTORE_USER      key alias, defaults to cloudyday_alias (optional)
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (8 for desktop targets, 9 required by Godot for Android)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono-linux

      - name: Download Godot ${{ env.GODOT_VERSION }} (.NET) + export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "${BASE}/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          curl -sSL -o templates.tpz "${BASE}/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          TPL_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "$TPL_DIR" /tmp/tpl
          unzip -q templates.tpz -d /tmp/tpl && rm templates.tpz
          mv /tmp/tpl/templates/* "$TPL_DIR"/

      - name: Put godot on PATH
        run: |
          GODOT_BIN=$(ls ~/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64)
          chmod +x "$GODOT_BIN"
          ln -sf "$GODOT_BIN" ~/godot/godot
          echo "$HOME/godot" >> "$GITHUB_PATH"
          "$GODOT_BIN" --version

      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # No fallback key here, on purpose: a store build signed with anything else is useless.
          if [ -z "${KEYSTORE_B64}" ] || [ -z "${KEYSTORE_PASSWORD}" ]; then
            echo "::error::ANDROID_RELEASE_KEYSTORE_B64 and ANDROID_RELEASE_KEYSTORE_PASSWORD must both be set as repo secrets."
            exit 1
          fi
          echo "${KEYSTORE_B64}" | base64 -d > ~/release.keystore
          test -s ~/release.keystore

      - name: Stamp version code/name
        # Play needs a strictly higher versionCode on every upload. The run number of THIS
        # workflow only ever goes up; the debug workflow's numbers are a different package.
        run: |
          mkdir -p build
          sed -i "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"0.9.${GITHUB_RUN_NUMBER}\"|" export_presets.cfg
          grep -E '^version/' export_presets.cfg

      - name: Pin dotnet CLI to the 9.0 SDK for this build (runner also ships .NET 10)
        run: |
          cat > global.json <<'JSON'
          { "sdk": { "version": "9.0.0", "rollForward": "latestFeature" } }
          JSON
          dotnet --version

      - name: Sanity-check the C# project the way Godot does before an Android export
        # Godot 4.7 runs exactly this and refuses to export unless the answer is "net9.0".
        run: |
          set -euo pipefail
          echo "dotnet: $(dotnet --version)"
          TFM=$(dotnet build AimFor20.csproj /p:GodotTargetPlatform=android --getProperty:TargetFramework 2>&1 | tee build/tfm-check.log | tail -1) || true
          echo "TargetFramework for android => '${TFM}'"
          if [ "${TFM}" != "net9.0" ]; then
            echo "::error::Godot needs the Android TargetFramework to resolve to net9.0 but got '${TFM}'. Build output follows."
            cat build/tfm-check.log
            exit 1
          fi

      - name: Check Android build template is committed
        run: |
          set -euo pipefail

          if [ ! -f android/build/build.gradle ]; then
            echo "::error::android/build is missing. In the editor: Project > Install Android Build Template, then commit android/."
            exit 1
          fi

          if [ ! -f android/build/gradlew ]; then
            echo "::error::android/build/gradlew is missing."
            exit 1
          fi

          # git doesn't reliably carry the executable bit through every checkout path
          # (Windows editors, some clone/rebase flows), so re-assert it every run
          # rather than relying solely on the bit committed in the tree.
          chmod +x android/build/gradlew
          test -x android/build/gradlew

      - name: Restore Godot engine .aar files into the build template (too big for git)
        run: |
          set -euo pipefail
          SRC=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono/android_source.zip
          unzip -o -q "$SRC" 'libs/*' -d android/build
          ls -la android/build/libs/debug android/build/libs/release
          test -s android/build/libs/release/godot-lib.template_release.aar

      - name: Accept Android SDK licences (Gradle pulls plugin dependencies)
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compile C# project for Android
        # The earlier sanity-check step only queries the resolved TargetFramework; it does
        # not actually compile the game scripts. Do that here, loudly, so a real C# error
        # (e.g. a script that fails to compile) is caught with a clear log instead of
        # surfacing later as a vague "script is not compiling" failure during import/export.
        run: |
          set -o pipefail
          dotnet build AimFor20.csproj \
            --configuration ExportRelease \
            /p:GodotTargetPlatform=android \
            -v:minimal \
            2>&1 | tee build/csharp-build.log

      - name: Import project (generates .godot cache)
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee build/import.log

      - name: Export Android Release AAB
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_RELEASE_KEYSTORE_USER || 'cloudyday_alias' }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$HOME/release.keystore"
          set +e
          godot --headless --path . --verbose --export-release "Android Release" build/AimFor20.aab 2>&1 | tee build/export.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "${STATUS}" != "0" ] || [ ! -s build/AimFor20.aab ]; then
            {
              echo "## Godot release export failed (exit ${STATUS})"
              echo '```'
              tail -200 build/export.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Godot release export failed (exit ${STATUS}). See job summary."
            exit 1
          fi
          ls -la build

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs-${{ github.run_number }}
          path: build/*.log
          if-no-files-found: ignore

      - name: Upload AAB (download this and upload it to Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: AimFor20-release-${{ github.run_number }}
          path: build/AimFor20.aab
          retention-days: 90
