name: Android APK

# Builds a debug APK on every push to main (and on demand), then publishes it as a
# GitHub Release so the phone can auto-update from it (see ANDROID.md).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (8 for desktop targets, 9 required by Godot for Android)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono-linux

      - name: Download Godot ${{ env.GODOT_VERSION }} (.NET) + export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "${BASE}/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          curl -sSL -o templates.tpz "${BASE}/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          TPL_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "$TPL_DIR" /tmp/tpl
          unzip -q templates.tpz -d /tmp/tpl && rm templates.tpz
          mv /tmp/tpl/templates/* "$TPL_DIR"/

      - name: Put godot on PATH
        run: |
          GODOT_BIN=$(ls ~/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64)
          chmod +x "$GODOT_BIN"
          ln -sf "$GODOT_BIN" ~/godot/godot
          echo "$HOME/godot" >> "$GITHUB_PATH"
          "$GODOT_BIN" --version

      - name: Prepare debug keystore
        # Android only installs an update over an existing app if both are signed with the
        # same key, so store ONE keystore as a repo secret (see ANDROID.md). If the secret is
        # missing a throwaway key is generated and the phone will need an uninstall first.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64}" ]; then
            echo "${KEYSTORE_B64}" | base64 -d > ~/debug.keystore
            echo "Using keystore from secrets."
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 secret not set; generating a throwaway keystore. Updates will not install over a previous build."
            keytool -genkeypair -v -keystore ~/debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Stamp version code/name from run number
        run: |
          mkdir -p build
          sed -i "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"0.1.${GITHUB_RUN_NUMBER}\"|" export_presets.cfg
          grep -E '^version/' export_presets.cfg

      - name: Sanity-check the C# project the way Godot does before an Android export
        # Godot 4.7 runs exactly this and refuses to export unless the answer is "net9.0".
        run: |
          set -euo pipefail
          echo "dotnet: $(dotnet --version)"
          TFM=$(dotnet build CardGame2.csproj /p:GodotTargetPlatform=android --getProperty:TargetFramework 2>&1 | tee build/tfm-check.log | tail -1) || true
          echo "TargetFramework for android => '${TFM}'"
          if [ "${TFM}" != "net9.0" ]; then
            echo "::error::Godot needs the Android TargetFramework to resolve to net9.0 but got '${TFM}'. Build output follows."
            cat build/tfm-check.log
            exit 1
          fi

      - name: Import project (generates .godot cache)
        run: godot --headless --path . --import 2>&1 | tee build/import.log || true

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: ${{ secrets.ANDROID_DEBUG_KEYSTORE_USER || 'androiddebugkey' }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD || 'android' }}
        run: |
          set -euo pipefail
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/debug.keystore"
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}  JAVA_HOME=${JAVA_HOME:-<unset>}"
          ls "${ANDROID_HOME}/build-tools" "${ANDROID_HOME}/platform-tools" 2>&1 | head -20
          set +e
          godot --headless --path . --verbose --export-debug "Android" build/CardGame2.apk 2>&1 | tee build/export.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "${STATUS}" != "0" ] || [ ! -s build/CardGame2.apk ]; then
            # Surface the real reason in the run's Annotations (visible without signing in).
            echo "::error::Godot export failed (exit ${STATUS}). Last lines of output:"
            grep -v "^\s*$" build/export.log | grep -iv "^\[verbose\]\|Registered\|Loading\|Godot Engine v" | tail -40 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
          ls -la build

      - name: Upload build logs (always, so failures can be inspected)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: build/*.log
          if-no-files-found: ignore

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardGame2-android-${{ github.run_number }}
          path: build/CardGame2.apk

      - name: Publish GitHub Release (phone auto-updates from here)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Android build ${{ github.run_number }}
          body: |
            Debug APK built from ${{ github.sha }}
            ${{ github.event.head_commit.message }}
          files: build/CardGame2.apk
